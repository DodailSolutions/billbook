# go2rtc configuration for BillBook CCTV Live Streaming
# Ultra-low latency (<100ms) WebRTC, RTSP, and HomeKit gateway
# Zero CPU re-encoding overhead - direct H.264/H.265 passthrough

api:
  listen: ":1984"
  origin: "*"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

# Example streams (configure your camera RTSP or ONVIF URLs here)
# streams:
#   gate_cam: rtsp://admin:password@192.168.1.100:554/Streaming/Channels/101
#   lobby_cam: rtsp://admin:password@192.168.1.101:554/cam/realmonitor?channel=1&subtype=0
