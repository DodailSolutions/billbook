<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
  <!-- QR Code SVG for Startup INDIA recognition -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Top-left finder pattern -->
  <rect x="10" y="10" width="50" height="50" fill="none" stroke="black" stroke-width="10"/>
  <rect x="20" y="20" width="30" height="30" fill="black"/>
  
  <!-- Top-right finder pattern -->
  <rect x="140" y="10" width="50" height="50" fill="none" stroke="black" stroke-width="10"/>
  <rect x="150" y="20" width="30" height="30" fill="black"/>
  
  <!-- Bottom-left finder pattern -->
  <rect x="10" y="140" width="50" height="50" fill="none" stroke="black" stroke-width="10"/>
  <rect x="20" y="150" width="30" height="30" fill="black"/>
  
  <!-- Timing patterns -->
  <line x1="70" y1="30" x2="130" y2="30" stroke="black" stroke-width="5"/>
  <line x1="30" y1="70" x2="30" y2="130" stroke="black" stroke-width="5"/>
  
  <!-- Data pattern (simplified) -->
  <rect x="80" y="80" width="10" height="10" fill="black"/>
  <rect x="95" y="80" width="10" height="10" fill="black"/>
  <rect x="110" y="80" width="10" height="10" fill="black"/>
  <rect x="80" y="95" width="10" height="10" fill="black"/>
  <rect x="110" y="95" width="10" height="10" fill="black"/>
  <rect x="80" y="110" width="10" height="10" fill="black"/>
  <rect x="95" y="110" width="10" height="10" fill="black"/>
  <rect x="110" y="110" width="10" height="10" fill="black"/>
  
  <!-- Startup INDIA Badge text (optional, can be removed) -->
  <text x="100" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="black">STARTUP INDIA</text>
</svg>