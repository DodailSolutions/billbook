name: Daily Supabase Database Backup

on:
  schedule:
    # Runs daily at 02:00 IST (20:30 UTC previous day)
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 15 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15

      - name: Run pg_dump against Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is not configured."
            exit 1
          fi
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          BACKUP_FILE="billbook_backup_${TIMESTAMP}.dump"
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl -f "$BACKUP_FILE"
          gzip -9 "$BACKUP_FILE"
          echo "BACKUP_GZ=${BACKUP_FILE}.gz" >> $GITHUB_ENV

      - name: Upload encrypted backup artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-daily-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_GZ }}
          retention-days: 30
